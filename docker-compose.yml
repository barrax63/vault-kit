name: vault-kit

volumes:
  postgres_storage:
  vaultwarden_storage:

networks:
  main:
    driver: bridge

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

x-security-baseline: &security-baseline
  security_opt:
    - no-new-privileges:true
    - apparmor=docker-default
  cap_drop:
    - ALL

services:
  postgres:
    <<: *security-baseline
    image: postgres:16-alpine
    hostname: postgres
    networks: ['main']
    restart: unless-stopped
    user: "postgres"
    env_file:
      - path: .env
        required: true
    environment:
      - PGTZ=${TZ}
      - POSTGRES_INITDB_ARGS=--data-checksums
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
    volumes:
      - postgres_storage:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -t 1 -q']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: '256mb'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging

  vaultwarden-init:
    image: busybox:latest
    user: root
    volumes:
      - vaultwarden_storage:/data
    command: sh -c "chown -R 1000:1000 /data && chmod 700 /data"
    restart: "no"
    networks: ['main']

  vaultwarden:
    <<: *security-baseline
    image: vaultwarden/server:latest
    networks:
      main:
        aliases:
          - vw-internal
    restart: unless-stopped
    hostname: vaultwarden
    user: 1000:1000
    volumes:
      - vaultwarden_storage:/data
    depends_on:
      vaultwarden-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    environment:
      - DOMAIN=https://${HOST}:${NGINX_PORT:-8443}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging: *default-logging

  nginx:
    <<: *security-baseline
    image: nginx:stable-alpine
    hostname: nginx
    networks: ['main']
    ports:
      - "${NGINX_PORT:-8443}:8443"
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    depends_on:
      vaultwarden:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    logging: *default-logging
